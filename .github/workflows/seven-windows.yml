name: Seven Gestion Windows — installateur et mises à jour

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "erp/**"
      - ".github/workflows/seven-windows.yml"
  workflow_dispatch:
    inputs:
      prepare_update:
        description: "Préparer une mise à jour GitHub Release"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: write # Required to publish a release after successful tests
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      SEVEN_ADMIN_SOURCE_DIR: ${{ github.workspace }}/seven-admin
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout the Windows application
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout the live Seven Gestion administrator UI
        uses: actions/checkout@v4
        with:
          repository: Nokscoding/seven-hotels-gestion
          ref: main
          path: seven-admin
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python for the verified vendor SDK bundle
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Check source and updater behavior
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ../seven-admin/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ../seven-admin/notifications.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer or prepare draft update
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_update }}
        run: |
          if ($env:RELEASE_MODE -eq 'true') {
            npm run dist:release
          } else {
            npm run dist:win
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test actual Electron desktop layout (CSS and modules)
        run: npm run test:layout
      - name: Verify installer exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem ../release -Filter "Seven-Gestion-Setup-*.exe"
          if (-not $exe) { throw "Installer Windows not built" }
          Write-Host "NSIS installer ready:" $exe.Name
      - name: Publish verified GitHub Release only after all desktop tests pass
        if: ${{ success() && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(desktop):') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $releaseDir = Join-Path (Resolve-Path ..).Path "release"
          $installer = Join-Path $releaseDir "Seven-Gestion-Setup-$version.exe"
          $manifest = Join-Path $releaseDir "latest.yml"
          $blockmap = "$installer.blockmap"
          if (-not (Test-Path $installer)) { throw "Installer absent" }
          if (-not (Test-Path $manifest)) { throw "Manifest latest.yml absent" }
          if (-not (Test-Path $blockmap)) { throw "Blockmap absent" }
          gh release create "v$version" "$installer" "$manifest" "$blockmap" --target "$env:GITHUB_SHA" --title "Seven Gestion v$version" --notes "Version 0.2.7 — configuration locale chiffrée bâtiment/étage/chambre/serrure S18 ; bouton Préparer la carte après check-in et ouverture du moteur Seven RFID Studio 2.2 avec CardLock ouvert. Encodage manuel et relecture nécessaires. Le moteur RFID 2.2 et les DLL du fabricant sont préservés. Validation de la nouvelle interface sur le poste de réception requise."
          if ($LASTEXITCODE -ne 0) { throw "GitHub draft release failed" }
      - name: Upload test installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Seven-Gestion-Setup-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/*Layout.png
            release/*Update*.png
            release/*RFID*.png
            release/*FAILED.png
          if-no-files-found: error
          retention-days: 14
