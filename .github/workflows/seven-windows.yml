name: Seven Gestion Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "erp/**"
      - ".github/workflows/seven-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout Seven
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          npm run check
          node --check ../erp/app.js
          node --check ../erp/notifications.js
      - name: Build Windows installer and portable EXE
        run: npm run dist:win
      - name: Share installer files
        uses: actions/upload-artifact@v4
        with:
          name: Seven-Gestion-Windows-${{ github.run_number }}
          path: release/**
          if-no-files-found: error
          retention-days: 14
